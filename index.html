<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventory Manager</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background: #f2f2f7;
    padding: 15px;
}

h1 {
    margin-top: 0;
}

.card {
    background: white;
    padding: 15px;
    margin-bottom: 12px;
    border-radius: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.product-name {
    font-size: 18px;
    font-weight: 600;
}

.quantity {
    color: #666;
    margin-top: 4px;
}

.row {
    display: flex;
    gap: 8px;
    margin-top: 10px;
}

button {
    border: none;
    border-radius: 12px;
    padding: 12px;
    font-size: 15px;
    cursor: pointer;
}

.gray {
    background: #e5e5ea;
}

.blue {
    background: #007aff;
    color: white;
}

.red {
    background: #ff3b30;
    color: white;
}

.fab {
    position: fixed;
    left: 15px;
    right: 15px;
    bottom: 20px;
    background: #007aff;
    color: white;
    font-weight: 600;
}

.modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.4);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 1000;
}

.modal {
    background: white;
    width: 90%;
    max-width: 400px;
    border-radius: 20px;
    padding: 20px;
}

input {
    width: 100%;
    padding: 12px;
    border-radius: 12px;
    border: 1px solid #ccc;
    margin-bottom: 10px;
    font-size: 16px;
}
</style>
</head>

<body>

<h1>Inventory Manager</h1>

<div id="inventoryList"></div>

<button class="fab" onclick="openAddModal()">
    + Add Product
</button>

<div id="modalContainer"></div>

<script>

const STORAGE_KEY = "inventory-manager-data";

function loadInventory() {
    try {
        return JSON.parse(
            localStorage.getItem(STORAGE_KEY)
        ) || [];
    } catch (e) {
        return [];
    }
}

let inventory = loadInventory();

function saveInventory() {

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(inventory)
    );

    renderInventory();
}

window.addEventListener("beforeunload", () => {

    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(inventory)
    );

});

function renderInventory() {

    const list =
        document.getElementById("inventoryList");

    list.innerHTML = "";

    inventory.forEach(item => {

        const card = document.createElement("div");

        card.className = "card";

        card.innerHTML = `
            <div class="product-name">
                ${item.name}
            </div>

            <div class="quantity">
                Quantity: ${item.quantity}
            </div>

            <div class="row">
                <button class="gray"
                    onclick="updateQuantity(${item.id},1)">
                    +1
                </button>

                <button class="gray"
                    onclick="updateQuantity(${item.id},-1)">
                    -1
                </button>
            </div>

            <div class="row">
                <button class="blue"
                    onclick="editProduct(${item.id})">
                    Edit
                </button>

                <button class="red"
                    onclick="deleteProduct(${item.id})">
                    Delete
                </button>
            </div>
        `;

        list.appendChild(card);
    });
}

function updateQuantity(id, amount) {

    inventory = inventory.map(item => {

        if (item.id === id) {

            item.quantity += amount;

            if (item.quantity < 0) {
                item.quantity = 0;
            }
        }

        return item;
    });

    saveInventory();
}

function openAddModal() {

    document.getElementById("modalContainer").innerHTML = `
        <div class="modal-overlay">
            <div class="modal">

                <h2>Add Product</h2>

                <input
                    id="productName"
                    placeholder="Product Name">

                <input
                    id="productQty"
                    type="number"
                    placeholder="Starting Quantity">

                <button class="blue"
                    onclick="addProduct()">
                    Add Product
                </button>

                <button
                    onclick="closeModal()">
                    Cancel
                </button>

            </div>
        </div>
    `;
}

function addProduct() {

    const name =
        document.getElementById("productName").value.trim();

    const qty =
        parseInt(
            document.getElementById("productQty").value
        ) || 0;

    if (!name) {
        return;
    }

    inventory.push({
        id: Date.now(),
        name: name,
        quantity: qty
    });

    closeModal();
    saveInventory();
}

function editProduct(id) {

    const item =
        inventory.find(i => i.id === id);

    document.getElementById("modalContainer").innerHTML = `
        <div class="modal-overlay">
            <div class="modal">

                <h2>Edit Product</h2>

                <input
                    id="editName"
                    value="${item.name}">

                <input
                    id="editQty"
                    type="number"
                    value="${item.quantity}">

                <button class="blue"
                    onclick="saveEdit(${id})">
                    Save
                </button>

                <button onclick="closeModal()">
                    Cancel
                </button>

            </div>
        </div>
    `;
}

function saveEdit(id) {

    const name =
        document.getElementById("editName").value.trim();

    const qty =
        parseInt(
            document.getElementById("editQty").value
        ) || 0;

    inventory = inventory.map(item => {

        if (item.id === id) {

            item.name = name;
            item.quantity = qty;

        }

        return item;
    });

    closeModal();
    saveInventory();
}

function deleteProduct(id) {

    const item =
        inventory.find(i => i.id === id);

    document.getElementById("modalContainer").innerHTML = `
        <div class="modal-overlay">
            <div class="modal">

                <h2>Delete Product</h2>

                <p>
                    Are you sure you want to delete
                    <strong>${item.name}</strong>?
                </p>

                <button class="red"
                    onclick="confirmDelete(${id})">
                    Delete
                </button>

                <button onclick="closeModal()">
                    Cancel
                </button>

            </div>
        </div>
    `;
}

function confirmDelete(id) {

    inventory =
        inventory.filter(item => item.id !== id);

    closeModal();
    saveInventory();
}

function closeModal() {
    document.getElementById("modalContainer").innerHTML = "";
}

renderInventory();

</script>

</body>
</html>
