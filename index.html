<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Inventory Manager</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 15px;
    background: #f2f2f7;
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
}

h1 {
    margin-top: 0;
}

.card {
    background: white;
    border-radius: 16px;
    padding: 15px;
    margin-bottom: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
}

.product-name {
    font-size: 18px;
    font-weight: 600;
}

.quantity {
    margin-top: 4px;
    color: #666;
}

.row {
    display: flex;
    gap: 8px;
    margin-top: 10px;
}

.row button {
    flex: 1;
}

button {
    border: none;
    border-radius: 12px;
    padding: 14px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
}

.gray {
    background: #e5e5ea;
}

.blue {
    background: #007aff;
    color: white;
}

.red {
    background: #ff3b30;
    color: white;
}

.fab {
    position: fixed;
    left: 15px;
    right: 15px;
    bottom: 20px;
    background: #007aff;
    color: white;
}

.modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.4);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 1000;
}

.modal {
    width: 90%;
    max-width: 400px;
    background: white;
    border-radius: 20px;
    padding: 20px;
}

input {
    width: 100%;
    padding: 12px;
    margin-bottom: 10px;
    border-radius: 12px;
    border: 1px solid #ccc;
    font-size: 16px;
}
</style>
</head>

<body>

<h1>Inventory Manager</h1>

<div id="inventoryList"></div>

<button class="fab" id="openAddBtn">
    + Add Product
</button>

<div id="modalContainer"></div>

<script>

const STORAGE_KEY = "inventory-manager-data";

let inventory = JSON.parse(
    localStorage.getItem(STORAGE_KEY) || "[]"
);

function saveInventory() {
    localStorage.setItem(
        STORAGE_KEY,
        JSON.stringify(inventory)
    );

    renderInventory();
}

function closeModal() {
    document.getElementById("modalContainer").innerHTML = "";
}

function renderInventory() {

    const list =
        document.getElementById("inventoryList");

    list.innerHTML = "";

    inventory.forEach(item => {

        const card =
            document.createElement("div");

        card.className = "card";

        card.innerHTML = `
            <div class="product-name">
                ${item.name}
            </div>

            <div class="quantity">
                Quantity: ${item.quantity}
            </div>

            <div class="row">
                <button class="gray"
                    data-plus="${item.id}">
                    +1
                </button>

                <button class="gray"
                    data-minus="${item.id}">
                    -1
                </button>
            </div>

            <div class="row">
                <button class="blue"
                    data-edit="${item.id}">
                    Edit
                </button>

                <button class="red"
                    data-delete="${item.id}">
                    Delete
                </button>
            </div>
        `;

        list.appendChild(card);
    });

    document.querySelectorAll("[data-plus]").forEach(btn => {
        btn.addEventListener("click", () => {
            changeQty(Number(btn.dataset.plus), 1);
        });
    });

    document.querySelectorAll("[data-minus]").forEach(btn => {
        btn.addEventListener("click", () => {
            changeQty(Number(btn.dataset.minus), -1);
        });
    });

    document.querySelectorAll("[data-edit]").forEach(btn => {
        btn.addEventListener("click", () => {
            openEditModal(Number(btn.dataset.edit));
        });
    });

    document.querySelectorAll("[data-delete]").forEach(btn => {
        btn.addEventListener("click", () => {
            openDeleteModal(Number(btn.dataset.delete));
        });
    });
}

function openAddModal() {

    document.getElementById("modalContainer").innerHTML = `
        <div class="modal-overlay">
            <div class="modal">

                <h2>Add Product</h2>

                <input
                    id="productName"
                    placeholder="Product Name">

                <input
                    id="productQty"
                    type="number"
                    placeholder="Starting Quantity">

                <button
                    class="blue"
                    id="addProductBtn">
                    Add Product
                </button>

                <button
                    id="cancelBtn">
                    Cancel
                </button>

            </div>
        </div>
    `;

    document
        .getElementById("addProductBtn")
        .addEventListener("click", addProduct);

    document
        .getElementById("cancelBtn")
        .addEventListener("click", closeModal);
}

function addProduct() {

    const name =
        document.getElementById("productName")
        .value
        .trim();

    const qty =
        parseInt(
            document.getElementById("productQty")
            .value || "0"
        );

    if (!name) {
        alert("Please enter a product name.");
        return;
    }

    inventory.push({
        id: Date.now(),
        name: name,
        quantity: isNaN(qty) ? 0 : qty
    });

    saveInventory();
    closeModal();
}

function openEditModal(id) {

    const item =
        inventory.find(i => i.id === id);

    document.getElementById("modalContainer").innerHTML = `
        <div class="modal-overlay">
            <div class="modal">

                <h2>Edit Product</h2>

                <input
                    id="editName"
                    value="${item.name}">

                <input
                    id="editQty"
                    type="number"
                    value="${item.quantity}">

                <button
                    class="blue"
                    id="saveEditBtn">
                    Save
                </button>

                <button
                    id="cancelEditBtn">
                    Cancel
                </button>

            </div>
        </div>
    `;

    document
        .getElementById("saveEditBtn")
        .addEventListener("click", () => {
            saveEdit(id);
        });

    document
        .getElementById("cancelEditBtn")
        .addEventListener("click", closeModal);
}

function saveEdit(id) {

    const name =
        document.getElementById("editName").value;

    const qty =
        parseInt(
            document.getElementById("editQty").value
        ) || 0;

    inventory = inventory.map(item => {

        if (item.id === id) {
            item.name = name;
            item.quantity = qty;
        }

        return item;
    });

    saveInventory();
    closeModal();
}

function openDeleteModal(id) {

    const item =
        inventory.find(i => i.id === id);

    document.getElementById("modalContainer").innerHTML = `
        <div class="modal-overlay">
            <div class="modal">

                <h2>Delete Product</h2>

                <p>
                    Delete <strong>${item.name}</strong>?
                </p>

                <button
                    class="red"
                    id="confirmDeleteBtn">
                    Delete
                </button>

                <button
                    id="cancelDeleteBtn">
                    Cancel
                </button>

            </div>
        </div>
    `;

    document
        .getElementById("confirmDeleteBtn")
        .addEventListener("click", () => {
            confirmDelete(id);
        });

    document
        .getElementById("cancelDeleteBtn")
        .addEventListener("click", closeModal);
}

function confirmDelete(id) {

    inventory =
        inventory.filter(
            item => item.id !== id
        );

    saveInventory();
    closeModal();
}

function changeQty(id, amount) {

    inventory =
        inventory.map(item => {

            if (item.id === id) {

                item.quantity += amount;

                if (item.quantity < 0) {
                    item.quantity = 0;
                }
            }

            return item;
        });

    saveInventory();
}

document
    .getElementById("openAddBtn")
    .addEventListener("click", openAddModal);

renderInventory();

</script>

</body>
</html>
